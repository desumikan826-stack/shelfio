<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>フレンド - Shelfio</title>
    <link rel="stylesheet" href="Tokens.css">
    <link rel="stylesheet" href="Forms.css">
    <link rel="stylesheet" href="Layout.css">
    <link rel="stylesheet" href="Books.css">
    <link rel="stylesheet" href="Pages.css">
    <link rel="stylesheet" href="Responsive.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header>
<div class="logo">
        📚 Shelfio
</div>

    <nav>
        <a href="search.html">🔍 検索</a>
        <a href="list.html">📚 本棚</a>
        <a href="wishlist.html">💖 ほしい本</a>
        <button id="menuToggleBtn" class="hamburger-btn">☰ その他</button>
    </nav>
</header>

<div id="sideMenuOverlay" class="side-menu-overlay"></div>
<aside id="sideMenu" class="side-menu">
    <button id="sideMenuClose" class="side-menu-close" aria-label="閉じる">&times;</button>
    <a href="index.html">🏠 トップへ戻る</a>
    <a href="updates.html">🗓 更新</a>
    <a href="stats.html">📊 統計</a>
    <a href="profile.html">👤 プロフィール</a>
    <a href="friends.html">🤝 フレンド</a>
    <button id="logoutBtn">ログアウト</button>
</aside>

<main>
    <h2>フレンド</h2>

    <section class="stats-section">
        <h3>自分の固有ID</h3>
        <p class="no-rating">この固有IDを相手に伝えると、あなたにフレンド申請を送ってもらえます。</p>
        <p id="friendsMyId" class="total-spent-amount" style="font-size:16px;word-break:break-all;"></p>
    </section>

    <section class="stats-section">
        <h3>固有IDでフレンド申請を送る</h3>
        <div class="form">
            <input id="friendTargetId" placeholder="相手の固有IDを入力">
            <button type="button" class="btn btn-primary" onclick="sendFriendRequest()">申請を送る</button>
        </div>
    </section>

    <section class="stats-section">
        <h3>受け取った申請</h3>
        <div id="incomingRequestList"></div>
    </section>

    <section class="stats-section">
        <h3>送った申請</h3>
        <div id="outgoingRequestList"></div>
    </section>

    <section class="stats-section">
        <h3>フレンド一覧</h3>
        <div id="friendList"></div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="main.js" type="module"></script>

</body>

</html>
