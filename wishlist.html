<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ほしい本 - Shelfio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>

<body>

<header>
<div class="logo">
        📚 Shelfio
</div>

    <nav>
        <a href="search.html">🔍 検索</a>
        <a href="list.html">📚 本棚</a>
        <a href="wishlist.html">💖 ほしい本</a>
        <button id="menuToggleBtn" class="hamburger-btn">☰ その他</button>
    </nav>
</header>

<div id="sideMenuOverlay" class="side-menu-overlay"></div>
<aside id="sideMenu" class="side-menu">
    <button id="sideMenuClose" class="side-menu-close" aria-label="閉じる">&times;</button>
    <a href="index.html">🏠 トップへ戻る</a>
    <a href="updates.html">🗓 更新</a>
    <a href="stats.html">📊 統計</a>
    <button id="logoutBtn">ログアウト</button>
</aside>

<main class="container">

    <section class="add-wishlist">
        <h2>手動で追加</h2>
        <form id="wishlistForm" onsubmit="event.preventDefault(); addWishlistFromForm();">
            <input id="w-title" placeholder="タイトル" required>
            <input id="w-author" placeholder="著者">
            <input id="w-isbn" placeholder="ISBN">
            <input id="w-image" placeholder="画像URL">
            <input id="w-price" placeholder="価格">
            <button type="submit">追加</button>
        </form>
    </section>

    <section>
        <div id="wishlistList" class="book-list">読み込み中...</div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="main.js" type="module"></script>
<script>
// This page re-uses globals and functions from main.js (supabase, currentUser, addWishlistItem, purchaseWishlistItem, deleteWishlistItem)

async function renderWishlistPage() {
    const container = document.getElementById('wishlistList');
    container.innerHTML = '読み込み中...';

    try {
        // Ensure we have currentUser; main.js normally sets this when signed in
        if (!window.currentUser) {
            const userRes = await window.globalSupabase.auth.getUser();
            window.currentUser = userRes?.data?.user || null;
        }

        if (!window.currentUser) {
            container.innerHTML = '<p>ログインしてください。<br><a href="login.html">ログイン / 新規登録</a></p>';
            return;
        }

        // Try to use the in-memory wishlists if available, otherwise fetch
        let items = window.wishlists || [];
        if (!items || items.length === 0) {
            // fetch from Supabase table (works even if this page loaded separately)
            const { data, error } = await window.globalSupabase
                .from('wishlists')
                .select('*')
                .eq('user_id', window.currentUser.id)
                .order('created_at', { ascending: true });

            if (error) {
                console.error('wishlists 読み込みエラー:', error);
                // show friendly message if table missing
                if (error?.code === 'PGRST205' || /Could not find the table/.test(error?.message || '')) {
                    container.innerHTML = '<p>データベースに「wishlists」テーブルが見つかりません。管理コンソールで作成してください。</p>';
                    return;
                }
                container.innerHTML = '<p>読み込み中にエラーが発生しました。コンソールを確認してください。</p>';
                return;
            }
            items = data || [];
            window.wishlists = items;
        }

        if (!items || items.length === 0) {
            container.innerHTML = '<p>ほしい本はまだありません。</p>';
            return;
        }

        container.innerHTML = items.map(item => {
            const title = item.title || '（タイトルなし）';
            const author = item.author || '';
            const id = item.id;
            return `
                <div class="book wishlist">
                    <img src="${escapeHTML(item.image || '')}" alt="表紙" class="book-image" onerror="this.style.display='none'">
                    <div class="book-info">
                        <h3>${escapeHTML(title)}</h3>
                        <p>著者：${escapeHTML(author)}</p>
                        <p>出版社：${escapeHTML(item.publisher || '不明')}</p>
                        <p>ISBN：${escapeHTML(item.isbn || 'なし')}</p>
                        ${item.price ? `<p>価格：${escapeHTML(item.price)}円</p>` : ''}

                        <p>
                            <button onclick="purchaseWishlistItem('${id}')">購入済みにする</button>
                            <button onclick="deleteWishlistItem('${id}')">削除</button>
                        </p>
                    </div>
                </div>
            `;
        }).join('');

    } catch (err) {
        console.error(err);
        container.innerHTML = '<p>エラーが発生しました。コンソールを確認してください。</p>';
    }
}

async function addWishlistFromForm() {
    const title = document.getElementById('w-title').value.trim();
    const author = document.getElementById('w-author').value.trim();
    const isbn = document.getElementById('w-isbn').value.trim();
    const image = document.getElementById('w-image').value.trim();
    const price = document.getElementById('w-price').value.trim();

    if (!title) return alert('タイトルを入力してください');

    const book = { title, author, isbn, image, price };
    try {
        if (typeof addWishlistItem === 'function') {
            await addWishlistItem(book);
        } else {
            // Fallback: insert directly via supabase
            await window.globalSupabase.from('wishlists').insert([{ ...book, user_id: window.currentUser.id }]);
        }
        // clear form
        document.getElementById('wishlistForm').reset();
        // re-render
        await renderWishlistPage();
    } catch (err) {
        console.error(err);
        alert('追加中にエラーが発生しました。コンソールを確認してください。');
    }
}

window.addEventListener('load', () => {
    // Delay slightly to allow main.js to initialize auth and load wishlists
    setTimeout(renderWishlistPage, 400);
});
</script>

</body>

</html>
