<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ほしい本 - Shelfio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header>
<div class="logo">
        📚 Shelfio
</div>

    <nav>
        <a href="search.html">🔍 検索</a>
        <a href="list.html">📚 本棚</a>
        <a href="wishlist.html">💖 ほしい本</a>
        <button id="menuToggleBtn" class="hamburger-btn">☰ その他</button>
    </nav>
</header>

<div id="sideMenuOverlay" class="side-menu-overlay"></div>
<aside id="sideMenu" class="side-menu">
    <button id="sideMenuClose" class="side-menu-close" aria-label="閉じる">&times;</button>
    <a href="index.html">🏠 トップへ戻る</a>
    <a href="updates.html">🗓 更新</a>
    <a href="stats.html">📊 統計</a>
    <button id="logoutBtn">ログアウト</button>
</aside>

<main class="container">
    <h1>ほしい本（Wishlist）</h1>

    <section class="add-wishlist">
        <h2>手動で追加</h2>
        <form id="wishlistForm" onsubmit="event.preventDefault(); addWishlistFromForm();">
            <input id="w-title" placeholder="タイトル" required>
            <input id="w-author" placeholder="著者">
            <input id="w-isbn" placeholder="ISBN">
            <input id="w-image" placeholder="画像URL">
            <input id="w-price" placeholder="価格">
            <button type="submit" class="btn btn-primary">追加</button>
        </form>
    </section>

    <section>
        <h2>リスト</h2>
        <div id="wishlistList" class="book-list">読み込み中...</div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="main.js" type="module"></script>

</body>

</html>
