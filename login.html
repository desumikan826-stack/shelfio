<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="login-container">

    <h2>📚 Shelfio</h2>

    <input type="email" id="email" placeholder="メールアドレス"><br><br>

    <input type="password" id="password" placeholder="パスワード"><br><br>

    <div class="auth-buttons">
        <button id="signinBtn" class="btn btn-primary">ログイン</button>
        <button id="signupBtn" class="btn btn-secondary">新規登録</button>
    </div>

    <p id="auth-message"></p>

    <p><a href="index.html">トップへ戻る</a></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="main.js" type="module"></script>

</body>
</html>
