<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Shelfio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header>
<div class="logo">
        📚 Shelfio
</div>

    <nav>
        <a href="search.html">🔍 検索</a>
        <a href="list.html">📚 本棚</a>
        <a href="wishlist.html">💖 ほしい本</a>
        <button id="menuToggleBtn" class="hamburger-btn">☰ その他</button>
    </nav>
</header>

<div id="sideMenuOverlay" class="side-menu-overlay"></div>
<aside id="sideMenu" class="side-menu">
    <button id="sideMenuClose" class="side-menu-close" aria-label="閉じる">&times;</button>
    <a href="index.html">🏠 トップへ戻る</a>
    <a href="updates.html">🗓 更新</a>
    <a href="stats.html">📊 統計</a>
    <button id="logoutBtn">ログアウト</button>
</aside>

    <!-- list.html の検索バーの上あたりに追加 -->

<div class="tabs">
    <button onclick="switchTab('all')" id="tab-all" class="tab-btn active">
        すべて
    </button>

    <button onclick="switchTab('unread')" id="tab-unread" class="tab-btn">
        未読
    </button>

    <button onclick="switchTab('reading')" id="tab-reading" class="tab-btn">
        読書中
    </button>

    <button onclick="switchTab('finished')" id="tab-finished" class="tab-btn">
        読了済み
    </button>

    <button onclick="switchTab('want')" id="tab-want" class="tab-btn">
        ほしい本
    </button>
</div>

<div id="collectionTabs" class="tabs"></div>
<div id="tagFilterBar" class="tabs tag-filter-bar"></div>

<!-- もともとある検索バー -->

<div class="search">

    <select id="sortType" onchange="displayBooks()">
        <option value="none">並び替えなし</option>
        <option value="rating">評価順</option>
        <option value="title">タイトル順</option>
    </select>

    <input
        type="text"
        id="search"
        placeholder="本を検索..."
        onkeyup="displayBooks()">

</div>

<div id="bookStats"></div>

<div id="bookList" class="book-list"></div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeSettings()">&times;</span>
        <h2>⚙️ 設定</h2>
        <p>ここに設定項目を追加できます。</p>
        <label>
            <input type="checkbox">
            ダークモード
        </label>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="main.js" type="module"></script>

</body>

</html>
