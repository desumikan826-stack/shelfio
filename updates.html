<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>更新スケジュール</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="forms.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="books.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header>
<div class="logo">
        📚 Shelfio
</div>

    <nav>
        <a href="search.html">🔍 検索</a>
        <a href="list.html">📚 本棚</a>
        <a href="wishlist.html">💖 ほしい本</a>
        <button id="menuToggleBtn" class="hamburger-btn">☰ その他</button>
    </nav>
</header>

<div id="sideMenuOverlay" class="side-menu-overlay"></div>
<aside id="sideMenu" class="side-menu">
    <button id="sideMenuClose" class="side-menu-close" aria-label="閉じる">&times;</button>
    <a href="index.html">🏠 トップへ戻る</a>
    <a href="updates.html">🗓 更新</a>
    <a href="stats.html">📊 統計</a>
    <button id="logoutBtn">ログアウト</button>
</aside>

    <main>
        <h2>更新スケジュール</h2>

        <section class="schedule-summary">
            <h3>今日更新</h3>
            <div id="todayUpdates"></div>
        </section>

        <section class="schedule-form">
            <h3>新しい更新スケジュールを登録</h3>
            <div class="form">
                <label>
                    登録済み作品
                    <select id="existingBook" onchange="handleExistingBookChange()">
                        <option value="">手動で入力</option>
                    </select>
                </label>

                <label>
                    タイトル
                    <input id="scheduleTitle" placeholder="作品タイトル">
                </label>

                <label>
                    著者
                    <input id="scheduleAuthor" placeholder="著者名">
                </label>

                <label>
                    作品リンク
                    <input id="scheduleLink" placeholder="作品ページのURL">
                </label>

                <label>
                    更新頻度
                    <select id="scheduleFrequency" onchange="handleFrequencyChange()">
                        <option value="weekly">週刊</option>
                        <option value="biweekly">隔週</option>
                    </select>
                </label>

                <label>
                    更新曜日
                    <select id="scheduleWeekday">
                        <option value="0">日曜日</option>
                        <option value="1">月曜日</option>
                        <option value="2">火曜日</option>
                        <option value="3">水曜日</option>
                        <option value="4">木曜日</option>
                        <option value="5">金曜日</option>
                        <option value="6">土曜日</option>
                    </select>
                </label>

                <label>
                    隔週開始日
                    <input id="scheduleStartDate" type="date">
                </label>

                <button type="button" class="btn btn-primary" onclick="addScheduleItem()">登録</button>
            </div>
        </section>

        <section class="schedule-list">
            <h3>登録済みスケジュール</h3>
            <div id="scheduleList"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js" type="module"></script>
</body>

</html>
